[project]
name = "eou-detector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.0",
    "ipykernel>=7.3.0",
    "scikit-learn>=1.9.0",
    "silero-vad>=6.2.1",
    "torch>=2.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires heavy models / Azure creds / audio hardware; skipped when absent",
]
